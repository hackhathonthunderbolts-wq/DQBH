version: '3.8'

services:
  # 1. PostgreSQL Database with PostGIS Extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: dqbh-postgres
    restart: always
    environment:
      POSTGRES_DB: dqbh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dqbh_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Pub/Sub & Caching Engine
  redis:
    image: redis:7-alpine
    container_name: dqbh-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. DQBH Node.js / TypeScript Core Backend API & WebSocket Hub
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dqbh-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/dqbh_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dqbh_industrial_secret_key_2026_super_secure
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. DQBH Frontend Dashboard & PWA (Vite / GSAP)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dqbh-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
